<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a3a6e;--green-light:#e8edf5;--green-dark:#0d2550;
  --gold:#f0a500;--gold-light:#fff8e1;
  --red:#c0392b;--red-light:#fdecea;
  --gray:#f5f5f5;--gray2:#e0e0e0;--gray3:#9e9e9e;--gray4:#424242;
  --white:#fff;--text:#1a1a1a;--shadow:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1f3c;color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;position:relative}

/* HEADER */
.header{background:var(--green);padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header-title{font-size:22px;font-weight:700;color:var(--white);letter-spacing:1px}
.header-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.badge-admin{background:var(--gold);color:#7a4f00;font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px}
.btn-logout{background:rgba(255,255,255,.15);border:none;color:var(--white);font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer}

/* NAV */
.nav{display:flex;border-bottom:1px solid var(--gray2);background:var(--white);position:sticky;top:60px;z-index:9}
.nav-btn{flex:1;padding:12px 4px;border:none;background:none;font-size:12px;font-weight:500;color:var(--gray3);cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green)}

/* CONTENT */
.content{flex:1;padding:16px;overflow-y:auto}

/* CARDS */
.card{background:var(--white);border:1px solid var(--gray2);border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--gray3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}

/* GAME CARD */
.game-card{background:linear-gradient(135deg,var(--green-dark),var(--green));border-radius:12px;padding:16px;margin-bottom:16px;color:var(--white)}
.game-date{font-size:20px;font-weight:700;letter-spacing:.5px}
.game-meta{font-size:12px;opacity:.8;margin-top:4px}
.game-slots{display:flex;align-items:center;gap:8px;margin-top:12px}
.slots-bar{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.slots-fill{height:100%;background:var(--gold);border-radius:3px;transition:.3s}
.slots-text{font-size:12px;font-weight:600}

/* PLAYER ROWS */
.player-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray)}
.player-row:last-child{border-bottom:none}
.player-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.av-green{background:var(--green-light);color:var(--green-dark)}
.av-gray{background:var(--gray);color:var(--gray3)}
.av-gold{background:var(--gold-light);color:#7a4f00}
.player-info{flex:1;min-width:0}
.player-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;white-space:nowrap}
.tag-zag{background:#e3f2fd;color:#1565c0}
.tag-meia{background:#f3e5f5;color:#6a1b9a}
.tag-atk{background:#fff3e0;color:#e65100}
.tag-ok{background:var(--green-light);color:var(--green-dark)}
.tag-nok{background:var(--red-light);color:var(--red)}
.tag-time{font-size:10px;color:var(--gray3)}
.presence-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--gray2);display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;font-size:12px}
.presence-check.confirmed{background:var(--green);border-color:var(--green);color:var(--white)}

/* FORMS */
.form-group{margin-bottom:14px}
label{font-size:12px;font-weight:600;color:var(--gray4);display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--gray2);border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:.2s;background:var(--white);color:var(--text)}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,58,110,.1)}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:var(--white)}
.btn-primary:hover{background:var(--green-dark)}
.btn-secondary{background:var(--gray);color:var(--gray4);margin-top:8px}
.btn-danger{background:var(--red);color:var(--white)}
.btn-gold{background:var(--gold);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;flex:1;min-height:100vh}
.login-logo{font-size:64px;margin-bottom:8px}
.login-title{font-size:28px;font-weight:800;color:var(--green);letter-spacing:1px}
.login-sub{font-size:13px;color:var(--gray3);margin-bottom:32px}

/* MENSALIDADE BANNERS */
.banner{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:13px}
.banner-ok{background:var(--green-light);color:var(--green-dark);border:1px solid #a5d6b7}
.banner-warn{background:#fff3cd;color:#856404;border:1px solid #ffc107}
.banner-err{background:var(--red-light);color:var(--red);border:1px solid #f5c6cb}

/* ADMIN ROWS */
.admin-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gray)}
.admin-row:last-child{border-bottom:none}
.icon-btn{background:none;border:1px solid var(--gray2);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;transition:.15s}
.icon-btn:hover{background:var(--gray)}
.icon-btn.del{border-color:#fbb;color:var(--red)}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray)}
.toggle-row:last-child{border-bottom:none}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--gray2);cursor:pointer;position:relative;transition:.2s;flex-shrink:0;border:none}
.toggle.on{background:var(--green)}
.toggle::after{content:'';width:18px;height:18px;background:var(--white);border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:21px}

/* SORT RESULT */
.sort-result{background:var(--green-light);border:1px solid #a5d6b7;border-radius:10px;padding:14px;margin-top:8px}
.sort-header{font-size:12px;font-weight:700;color:var(--green-dark);margin-bottom:10px}
.sort-group{margin-bottom:8px}
.sort-group-label{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
.sort-names{font-size:13px;color:var(--gray4);margin-top:3px}

/* NOTIFICATION TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#222;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;transition:.3s;max-width:320px;text-align:center;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green-dark)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;flex-direction:column;gap:12px;color:var(--gray3);font-size:13px}
.spinner{width:28px;height:28px;border:3px solid var(--gray2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{text-align:center;padding:32px 16px;color:var(--gray3);font-size:13px;line-height:1.6}
.section-label{font-size:11px;font-weight:700;color:var(--gray3);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--gray2);margin:8px 0}
.chip{display:inline-flex;align-items:center;background:var(--gray);color:var(--gray4);border-radius:8px;font-size:11px;padding:2px 8px;margin:2px;font-weight:500}

/* SETUP SCREEN */
.setup-step{background:var(--white);border:1px solid var(--gray2);border-radius:12px;padding:20px;margin-bottom:12px}
.setup-step h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.setup-step p{font-size:12px;color:var(--gray3);line-height:1.5;margin-bottom:12px}
.code-block{background:#1e1e1e;color:#d4d4d4;border-radius:8px;padding:12px;font-size:11px;font-family:monospace;overflow-x:auto;margin-bottom:8px;white-space:pre}
.copy-btn{background:var(--gray);border:none;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600;color:var(--gray4)}

/* CARNE */
.carne-feature{background:linear-gradient(135deg,#223f74,#1a3a6e);color:#fff;border-radius:14px;padding:14px 14px 10px;margin:0 0 12px 0;box-shadow:var(--shadow)}
.carne-feature .carne-kicker{font-size:10px;opacity:.78;text-transform:uppercase;letter-spacing:.8px}
.carne-feature .carne-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:6px}
.carne-feature .carne-date{font-size:22px;font-weight:800;line-height:1}
.carne-feature .carne-names{font-size:16px;font-weight:700;margin-top:6px}
.carne-feature .carne-note{font-size:12px;opacity:.82;margin-top:6px}
.carne-badge{background:rgba(255,193,7,.95);color:#5b4300;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.carne-list-card{margin-bottom:12px}
.carne-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray)}
.carne-row:last-child{border-bottom:none}
.carne-row.current{background:#eef4ff;border-radius:10px;padding:10px 10px;border-bottom:none;margin:0 -2px 8px -2px}
.carne-date-pill{min-width:72px;text-align:center;background:var(--gray);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--gray4);line-height:1.2}
.carne-row.current .carne-date-pill{background:#d9e6ff;color:#1a3a6e}
.carne-pair{flex:1}
.carne-pair-main{font-size:14px;font-weight:700}
.carne-pair-sub{font-size:11px;color:var(--gray3);margin-top:2px}
.carne-actions{display:flex;gap:6px;flex-wrap:wrap}
.carne-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.carne-grid{grid-template-columns:1fr}.carne-row{align-items:flex-start}.carne-date-pill{min-width:64px}}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="spinner"></div>Carregando...</div>
</div>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script>function render(){
  if(!currentPhone){ renderLogin(); return; }
  const tabs = isAdmin()
    ? [{k:'home',l:'Início'},{k:'presença',l:'Presenças'},{k:'campeonato',l:'🏆'},{k:'histórico',l:'📊'},{k:'carne',l:'Carne'},{k:'jogadores',l:'Jogadores'},{k:'config',l:'Config'}]
    : [{k:'home',l:'Início'},{k:'presença',l:'Presenças'},{k:'campeonato',l:'🏆'},{k:'histórico',l:'📊'},{k:'carne',l:'Carne'}];

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div>
        <div class="header-title">HARMONIA</div>
        <div class="header-sub">${currentPlayer?.name||''}</div>
      </div>
      <div class="header-right">
        ${isAdmin()?'<span class="badge-admin">ADMIN</span>':''}
        <button class="btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="nav">
      ${tabs.map(t=>`<button class="nav-btn ${currentTab===t.k?'active':''}" onclick="setTab('${t.k}')">${t.l}</button>`).join('')}
    </div>
    <div class="content" id="content"></div>
  `;
  renderTab();
}

function renderTab(){
  if(currentTab==='home') renderHome();
  else if(currentTab==='presença') renderPresence();
  else if(currentTab==='campeonato') renderCampeonato();
  else if(currentTab==='histórico') renderHistorico();
  else if(currentTab==='carne') renderCarne();
  else if(currentTab==='jogadores') renderPlayers();
  else if(currentTab==='config') renderConfig();
}

function setTab(t){ currentTab=t; render(); }

async function hashPassword(pwd){
  const enc = new TextEncoder().encode(pwd);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin(){
  const phone = document.getElementById('login-phone')?.value?.replace(/\D/g,'');
  if(!phone||phone.length<8){ toast('Informe um número válido','err'); return; }
  const player = appData.players.find(p=>p.phone===phone);
  if(!player){ toast('Número não cadastrado. Faça seu cadastro.','err'); return; }

  // Admin — se não tiver senha ainda, vai direto criar senha; senão pede senha normalmente
  if(isAdminPhone(phone)){
    if(!player.password_hash){
      renderSetPassword(phone);
    } else {
      renderPasswordLogin(phone, player);
    }
    return;
  }

  // Not yet activated — show activation screen
  if(!player.password_hash){
    if(!player.activation_code){
      // Show a nicer screen instead of just a toast
      renderNeedActivation(phone, player);
      return;
    }
    renderActivation(phone, player);
    return;
  }

  // Has password — show password screen
  renderPasswordLogin(phone, player);
}

function isAdminPhone(phone){ return !!appData.players.find(p=>p.phone===phone && playerIsAdmin(p)); }

function finishLogin(player, fromPassword=false){
  currentPhone = player.phone;
  currentPlayer = player;
  sessionStorage.setItem('pelada_phone', player.phone);
  currentTab = 'home';
  render();
  if(appData.game?.open){
    setTimeout(()=>toast('🔔 Jogo aberto para confirmações!'),500);
  }
  if(fromPassword) offerPasskey(player.phone);
}

async function submitPassword(phone){
  const pwd = document.getElementById('pw-input')?.value;
  if(!pwd){ toast('Digite sua senha','err'); return; }
  const player = appData.players.find(p=>p.phone===phone);
  if(!player) return;
  const hash = await hashPassword(pwd);
  if(hash !== player.password_hash){
    toast('Senha incorreta','err');
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
    return;
  }
  finishLogin(player, true);
}

async function submitActivation(phone){
  const code = document.getElementById('act-code')?.value?.trim();

  if(String(player.activation_code) !== String(code)){

  }
  // Code correct — show set password screen
  renderSetPassword(phone);
}

async function saveNewPassword(phone, isReset){
  const pwd = document.getElementById('new-pw')?.value;

  if(!pwd||pwd.length<4){ toast('Senha deve ter ao menos 4 caracteres','err'); return; }
  if(pwd !== pwd2){ toast('As senhas não coincidem','err'); return; }
  const hash = await hashPassword(pwd);
  const btn = document.querySelector('.btn-primary');
  if(btn) btn.disabled=true;
  const {data, error} = await sb.from('players')
    .update({password_hash: hash, activation_code: null})
    .eq('phone', phone).select().single();
  if(error){ toast('Erro: '+error.message,'err'); if(btn) btn.disabled=false; return; }
  const idx = appData.players.findIndex(p=>p.phone===phone);
  if(idx>=0) appData.players[idx] = data;
  toast('Senha criada com sucesso!');
  finishLogin(data, true);
}

async function doRegister(){
  const name = document.getElementById('r-name')?.value?.trim();
  const phone = document.getElementById('r-phone')?.value?.replace(/\D/g,'');
  const birth = document.getElementById('r-birth')?.value;

      <div>
        <div class="card-title" style="margin-bottom:10px">Carne da semana</div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
          <div>
            <div style="font-size:22px;font-weight:800;color:#1a3a6e">${formatCarneDateShort(currentCarne.date)}</div>
            <div style="font-size:16px;font-weight:700;margin-top:6px">${currentCarne.a} + ${currentCarne.b}</div>

    const wait = res.waitlist||[];
    const waitPlayers = wait.map(id=>appData.players.find(p=>p.id===id)).filter(Boolean);
    const teamAPlayers = (res.teamA||[]);
    const teamBPlayers = (res.teamB||[]);
    const resultLabel = res.result==='A'?'🏆 Time A venceu':res.result==='B'?'🏆 Time B venceu':res.result==='empate'?'🤝 Empate':'';
    sortHtml = `
      <div class="sort-result">
        <div class="sort-header">🎲 Times sorteados · ${formatDateTime(res.ts)}</div>
        ${resultLabel?`<div style="font-size:13px;font-weight:700;color:var(--green-dark);margin-bottom:8px">${resultLabel}</div>`:''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">

          </div>
          <div style="background:#fce4ec;border-radius:8px;padding:8px">
            <div style="font-size:10px;font-weight:700;color:#c62828;margin-bottom:4px">TIME B</div>

    lastThursday.setDate(today.getDate() - daysToLastThursday);
    lastThursday.setHours(0,0,0,0);
    let nextWednesday;
    if(g && g.game_date){
      nextWednesday = new Date(g.game_date + 'T23:59:59');
    } else {
      const daysToWed = dow <= 3 ? 3 - dow : 10 - dow;

      nextWednesday.setDate(today.getDate() + daysToWed);

    `;
  })();

      <div>${mensalidadeCard}</div>
      <div>${carneWeekCard}</div>

    ${birthdayHtml}
    ${belowPrimaryHtml}
  `;
}


async function togglePresence(){
  if(!currentPlayer||!appData.game) return;
  const myConf = getMyConfirmation();
  const isConfirmed = myConf?.confirmed;
  if(!isConfirmed && !canConfirm(currentPlayer)){
    toast('Você não pode confirmar (mensalidade em aberto)','err'); return;
  }
  const btn = document.querySelector('.btn-primary,.btn-danger');
  if(btn) btn.disabled=true;

  let error;
  if(myConf){
    const res = await sb.from('confirmations').update({confirmed:!isConfirmed,confirmed_at:!isConfirmed?new Date().toISOString():null}).eq('id',myConf.id);
    error = res.error;
    if(!error){
      const idx = appData.confirmations.findIndex(c=>c.id===myConf.id);
      if(idx>=0){ appData.confirmations[idx].confirmed=!isConfirmed; appData.confirmations[idx].confirmed_at=!isConfirmed?new Date().toISOString():null; }
    }
  } else {
    const res = await sb.from('confirmations').insert({player_id:currentPlayer.id,game_id:appData.game.id,confirmed:true,confirmed_at:new Date().toISOString()}).select().single();
    error = res.error;
    if(!error) appData.confirmations.push(res.data);
  }
  if(error){ toast('Erro: '+error.message,'err'); if(btn) btn.disabled=false; return; }
  toast(isConfirmed?'Presença desmarcada':'Presença confirmada! ⚽');
  render();
}

async function savePlayer(){
  const name = document.getElementById('ep-name')?.value?.trim();
  const phone = document.getElementById('ep-phone')?.value?.replace(/\D/g,'');
  const birth_date = document.getElementById('ep-birth')?.value;
  const position = document.getElementById('ep-pos')?.value;
  const mens_ok = document.getElementById('mens-toggle')?.classList.contains('on');
  const is_admin = document.getElementById('admin-toggle')?.classList.contains('on');
  if(!name||!phone){ toast('Nome e celular obrigatórios','err'); return; }

  const btn = document.getElementById('save-btn');
  if(btn) btn.disabled=true;

  if(editingPlayer==='new'){
    if(appData.players.find(p=>p.phone===phone)){ toast('Celular já cadastrado','err'); if(btn) btn.disabled=false; return; }
    const {data,error} = await sb.from('players').insert({name,phone,birth_date,position,mens_ok,is_admin}).select().single();
    if(error){ toast('Erro: '+error.message,'err'); if(btn) btn.disabled=false; return; }
    appData.players.push(data);
  } else {
    const {data,error} = await sb.from('players').update({name,phone,birth_date,position,mens_ok,is_admin}).eq('id',editingPlayer).select().single();
    if(error){ toast('Erro: '+error.message,'err'); if(btn) btn.disabled=false; return; }
    const idx = appData.players.findIndex(p=>p.id===editingPlayer);
    if(idx>=0) appData.players[idx]=data;
    if(currentPhone===phone) currentPlayer=data;
  }
  toast('Jogador salvo!');
  editingPlayer=null;
  render();
}

async function deletePlayer(id){
  if(!confirm('Remover este jogador?')) return;
  const {error} = await sb.from('players').delete().eq('id',id);
  if(error){ toast('Erro: '+error.message,'err'); return; }
  appData.players = appData.players.filter(p=>p.id!==id);
  appData.confirmations = appData.confirmations.filter(c=>c.player_id!==id);
  toast('Jogador removido');
  render();
}

      </p>
      <button class="btn btn-gold" onclick="doSort()">🎲 Realizar sorteio</button>
      ${g?.sort_result?`<button class="btn btn-secondary" onclick="clearSort()">Limpar resultado do sorteio</button>`:''}
    </div>
    <div class="card">
      <div class="card-title">Campeonato atual</div>
      <p style="font-size:12px;color:var(--gray3);margin-bottom:12px;line-height:1.5">
        Encerre o campeonato atual para registrar o pódio no histórico e iniciar o próximo período automaticamente.
      </p>
      ${getViewedChamp()&&!getViewedChamp().closed?`<button class="btn btn-gold" onclick="closeChampionship()">🏆 Encerrar campeonato</button>`:`<div style="font-size:12px;color:var(--gray3)">Campeonato já encerrado.</div>`}
    </div>

    <div class="card">
      <div class="card-title">Aviso aos jogadores</div>
      <div class="form-group"><label>Mensagem</label><input id="notif-msg" placeholder="Ex: Jogo confirmado no campo A"></div>
      <button class="btn btn-secondary" onclick="sendNotif()">📢 Publicar aviso</button>
    </div>

    <div class="card">
      <div class="card-title" style="color:var(--red)">Zona de perigo</div>
      <button class="btn btn-danger" onclick="resetConfirmations()">🗑 Limpar todas as confirmações</button>
    </div>
  `;
}

async function saveConfig(){
  const date = document.getElementById('g-date')?.value;
  const time = document.getElementById('g-time')?.value;
  const max = parseInt(document.getElementById('g-max')?.value)||14;
  const mens = document.getElementById('g-mens')?.value||null;
  const open = document.getElementById('game-open-toggle')?.classList.contains('on');
  const btn = document.getElementById('save-cfg-btn');
  if(btn) btn.disabled=true;

  const wasOpen = appData.game?.open;
  const payload = {game_date:date||null,game_time:time||null,max_players:max,mens_expire_date:mens,open};

  let error, data;
  if(appData.game?.id){
    const res = await sb.from('games').update(payload).eq('id',appData.game.id).select().single();
    error=res.error; data=res.data;
  } else {
    const res = await sb.from('games').insert(payload).select().single();
    error=res.error; data=res.data;
  }
  if(error){ toast('Erro: '+error.message,'err'); if(btn) btn.disabled=false; return; }
  appData.game = data;

  if(!wasOpen && open){
    await sb.from('notifications').insert({message:`Inscrições abertas para o jogo de ${date?formatDateBR(date):'em breve'}!`});
    const res = await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(10);
    appData.notifications = res.data||[];
  }
  toast('Configurações salvas!');
  if(btn) btn.disabled=false;
  render();
}

async function doSort(){
  const g = appData.game;
  if(!g) return;
  const eligible = getConfirmedPlayers().filter(p=>canConfirm(p));
  if(!eligible.length){ toast('Nenhum jogador elegível para o sorteio','err'); return; }

  const max = g.max_players||14;
  // Separate by position and shuffle each group
  const byPos = {Zagueiro:[],Meia:[],Atacante:[]};
  eligible.forEach(p=>{ const pos = byPos[p.position] ? p.position : 'Meia'; byPos[pos].push(p); });
  Object.keys(byPos).forEach(pos => byPos[pos].sort(()=>Math.random()-.5));

  // Interleave positions to fill slots evenly
  const pool = [];
  const maxLen = Math.max(...Object.values(byPos).map(a=>a.length));
  for(let i=0;i<maxLen;i++){
    ['Zagueiro','Meia','Atacante'].forEach(pos=>{ if(byPos[pos][i]) pool.push(byPos[pos][i]); });
  }

  const selected = pool.slice(0, max);
  const waitlist = [...eligible.filter(p=>!selected.find(s=>s.id===p.id))].map(p=>p.id);

  // Split into two balanced teams by position
  // Each team gets proportional zagueiros, meias, atacantes
  const teamA = [], teamB = [];
  ['Zagueiro','Meia','Atacante'].forEach(pos => {
    const inPos = selected.filter(p=>(p.position===pos)||(pos==='Meia'&&!['Zagueiro','Atacante'].includes(p.position)));
    // avoid duplicates from 'Meia' fallback — use actual position
  });

  // Cleaner split: group selected by position, alternate A/B within each group
  const posGroups = {Zagueiro:[],Meia:[],Atacante:[]};
  selected.forEach(p=>{ const pos = posGroups[p.position]!==undefined?p.position:'Meia'; posGroups[pos].push(p); });
  Object.values(posGroups).forEach(group=>{
    group.forEach((p,i)=>{ if(i%2===0) teamA.push(p); else teamB.push(p); });
  });

  const sort_result = {
    selected: selected.map(p=>p.id),
    waitlist,
    teamA: teamA.map(p=>({id:p.id, name:p.name, position:p.position})),
    teamB: teamB.map(p=>({id:p.id, name:p.name, position:p.position})),
    ts: new Date().toISOString(),
    result: null  // 'A' | 'B' | 'empate' — filled by admin later
  };
  const {error} = await sb.from('games').update({sort_result}).eq('id',g.id);
  if(error){ toast('Erro: '+error.message,'err'); return; }
  appData.game.sort_result = sort_result;
  toast('Sorteio realizado! Times A e B definidos 🎲');
  render();
}

async function clearSort(){
  if(!appData.game?.id) return;
  await sb.from('games').update({sort_result:null}).eq('id',appData.game.id);
  appData.game.sort_result = null;
  render();
}

async function sendNotif(){
  const msg = document.getElementById('notif-msg')?.value?.trim();
  if(!msg){ toast('Digite uma mensagem','err'); return; }
  const {data,error} = await sb.from('notifications').insert({message:msg}).select().single();
  if(error){ toast('Erro: '+error.message,'err'); return; }
  appData.notifications.unshift(data);
  toast('Aviso publicado!');
  document.getElementById('notif-msg').value='';
}

async function resetConfirmations(){
  if(!appData.game?.id) return;
  if(!confirm('Apagar TODAS as confirmações deste jogo?')) return;
  const {error} = await sb.from('confirmations').delete().eq('game_id',appData.game.id);
  if(error){ toast('Erro: '+error.message,'err'); return; }
  appData.confirmations = [];
  toast('Confirmações apagadas');
  render();
}

function getChampEditableDates(champ){
  if(!champ || isAnnualSummaryChamp(champ)) return [];
  const dates = new Set();
  (champ.game_dates||[]).forEach(d=>{ if(d) dates.add(d); });
  (champ.players||[]).forEach(p=> Object.keys(p.scores||{}).forEach(d=>{ if(d) dates.add(d); }));
  const currentGameDate = appData.game?.game_date;
  if(currentGameDate && currentGameDate >= champ.start && currentGameDate <= champ.end) dates.add(currentGameDate);
  return [...dates].sort((a,b)=> b.localeCompare(a));
}

function getChampCurrentScoreForDate(champ, playerName, date){
  const p = (champ?.players||[]).find(x=>x.name===playerName);
  if(!p) return null;
  if(p.scores && Object.prototype.hasOwnProperty.call(p.scores, date)) return p.scores[date];

  const gameDate = appData.game?.game_date;
  const res = appData.game?.sort_result;
  if(date!==gameDate || !res) return null;

  const norm = s => String(s||'').trim().toLowerCase();
  const inA = (res.teamA||[]).some(pl=>norm(pl.name)===norm(playerName));
  const inB = (res.teamB||[]).some(pl=>norm(pl.name)===norm(playerName));
  const inWait = (res.waitlist||[]).some(id=>{
    const pl = appData.players.find(p=>p.id===id);
    return pl && norm(pl.name)===norm(playerName);
  });
  if(inA){
    if(res.result==='A') return 3;
    if(res.result==='B') return 1;
    if(res.result==='empate') return 2;
  }
  if(inB){
    if(res.result==='B') return 3;
    if(res.result==='A') return 1;
    if(res.result==='empate') return 2;
  }
  if(inWait) return 0;
  return null;
}

// Ciclos quadrimestrais
const CYCLES = [
  {name:'Abertura',  months:[1,2,3,4]},
  {name:'Inverno',   months:[5,6,7,8]},
  {name:'Encerramento', months:[9,10,11,12]},
];

function getCycleName(dateStr){
  const m = new Date(dateStr+'T12:00:00').getMonth()+1;
  const c = CYCLES.find(c=>c.months.includes(m));
  return c ? c.name : '';
}

function getChampLabel(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  return getCycleName(dateStr)+' '+d.getFullYear();
}

// Generate wednesday dates for a given year+cycle
function getCycleDates(year, cycleIdx){
  const months = CYCLES[cycleIdx].months;
  const first = new Date(year, months[0]-1, 1);
  const last  = new Date(year, months[months.length-1], 0); // last day of last month
  const dates = [];
  // find first wednesday
  let d = new Date(first);
  while(d.getDay()!==3) d.setDate(d.getDate()+1);
  while(d<=last){
    dates.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+7);
  }
  return dates;
}

function buildNewChamp(year, cycleIdx, existingPlayers){
  return {
    name: CYCLES[cycleIdx].name+' '+year,
    start: getCycleDates(year, cycleIdx)[0],
    end: getCycleDates(year, cycleIdx).slice(-1)[0],
    game_dates: getCycleDates(year, cycleIdx),
    players: (existingPlayers||[]).map(p=>{return {name:p.name, scores:{}}})
  };
}

let champData = null;      // current championship

let viewingChampIdx = 0;   // which champ is being viewed (0=current)

function isAnnualSummaryChamp(champ){
  return champ?.kind==='annual_summary';
}

function getChampYear(ch){
  const baseDate = ch?.start || ch?.end;
  if(baseDate) return new Date(baseDate+'T12:00:00').getFullYear();
  const m = String(ch?.name||'').match(/(20\d{2}|\d{2})$/);
  if(!m) return null;
  const y = Number(m[1]);
  return y < 100 ? 2000 + y : y;
}

function getChampCycleOrder(ch){
  const n = String(ch?.name||'').toLowerCase();
  if(isAnnualSummaryChamp(ch)) return 4;
  if(n.includes('abertura')) return 1;
  if(n.includes('inverno')) return 2;
  if(n.includes('encerramento')) return 3;
  return 9;
}

function formatChampDisplayName(ch){
  if(!ch) return '';
  const year = getChampYear(ch);
  const yy = year ? String(year).slice(-2) : '';
  if(isAnnualSummaryChamp(ch)) return `Geral ${yy}`;
  const cycle = getCycleName(ch.start || ch.end) || String(ch.name||'').replace(/\s+(20\d{2}|\d{2})$/,'').trim();
  return yy ? `${cycle} ${yy}` : (ch.name||'');
}

function getChampSortKey(ch){
  const year = getChampYear(ch) || 0;
  const cycle = getChampCycleOrder(ch);
  return `${9999-year}|${cycle}|${formatChampDisplayName(ch)}`;
}

function getChampPlayedCount(ch){
  return [...new Set((ch?.players||[]).flatMap(p=>Object.keys(p.scores||{})))].length;
}

function dedupeCompetitiveChamps(champs){
  const bestByKey = new Map();
  (champs||[]).forEach(ch=>{
    if(!ch || isAnnualSummaryChamp(ch)) return;
    const year = getChampYear(ch);
    const cycle = getChampCycleOrder(ch);
    const key = `${year||''}|${cycle}|${(ch.start||'')}|${(ch.end||'')}`;
    const existing = bestByKey.get(key);
    if(!existing){
      bestByKey.set(key, ch);
      return;
    }
    const existingPlayed = getChampPlayedCount(existing);
    const currentPlayed = getChampPlayedCount(ch);
    const existingHasDb = !!existing._db_id;
    const currentHasDb = !!ch._db_id;
    if(
      currentPlayed > existingPlayed ||
      (currentPlayed === existingPlayed && currentHasDb && !existingHasDb)
    ){
      bestByKey.set(key, ch);
    }
  });
  return [...bestByKey.values()];
}

function getCompetitiveChamps(champs){
  return dedupeCompetitiveChamps((champs||[]).filter(ch=>!isAnnualSummaryChamp(ch)));
}

function buildAnnualSummaryChamp(year, champs){
  const yearlyChamps = sortChampsForUi(getCompetitiveChamps(champs).filter(ch=>{
    const baseDate = ch.start || ch.end;
    if(!baseDate) return false;
    return new Date(baseDate+'T12:00:00').getFullYear()===year;
  }));
  if(!yearlyChamps.length) return null;

  const playerMap = new Map();
  const gameDates = new Set();

  yearlyChamps.forEach(ch=>{
    (ch.game_dates||[]).forEach(d=>gameDates.add(d));
    (ch.players||[]).forEach(p=>{
      const key = (p.name||'').trim();
      if(!key) return;
      if(!playerMap.has(key)){
        playerMap.set(key, {
          name: p.name,
          pts: 0,
          v: 0,
          e: 0,
          d: 0,
          wo: 0,
          jogos: 0,
          champs: 0,
        });
      }
      const acc = playerMap.get(key);
      acc.champs += 1;
      Object.entries(p.scores||{}).forEach(([date, score])=>{
        const s = Number(score);
        if(!Number.isFinite(s)) return;
        gameDates.add(date);
        acc.pts += s;
        acc.jogos += 1;
        if(s===3) acc.v += 1;
        else if(s===2) acc.e += 1;
        else if(s===1) acc.d += 1;
        else if(s===0) acc.wo += 1;
      });
    });
  });

  const players = [...playerMap.values()].map(p=>({
    name: p.name,
    scores: {[`${year}-annual-total`]: p.pts},
    summary: {
      sort_value: p.pts,
      pts_display: p.pts,
      v: p.v,
      e: p.e,
      d: p.d,
      wo: p.wo,
      jogos: p.jogos,
      champs: p.champs,
    }
  }));

  const sorted = [...players].sort((a,b)=>{
    const as = a.summary||{}, bs = b.summary||{};
    return (bs.sort_value||0)-(as.sort_value||0)
      || (bs.v||0)-(as.v||0)
      || (bs.e||0)-(as.e||0)
      || (as.d||0)-(bs.d||0)
      || a.name.localeCompare(b.name);
  });

  return {
    kind: 'annual_summary',
    name: `Geral ${String(year).slice(-2)}`,
    start: yearlyChamps[0].start,
    end: yearlyChamps[yearlyChamps.length-1].end,
    game_dates: [...gameDates].sort(),
    players,
    podium: sorted.slice(0,3).map(p=>p.name),
    winner: sorted[0]?.name || null,
    closed: yearlyChamps.every(ch=>ch.closed),
    source_championships: yearlyChamps.map(ch=>ch.name),
  };
}

function rebuildChampViews(champs){
  const competitive = sortChampsForUi(getCompetitiveChamps(champs));
  const years = [...new Set(competitive.map(ch=>getChampYear(ch)).filter(Boolean))].sort((a,b)=>a-b);
  const annual = years.map(year=>buildAnnualSummaryChamp(year, competitive)).filter(Boolean);
  return sortChampsForUi([...competitive, ...annual]);
}

function sortChampsForUi(champs){
  return [...(champs||[])].sort((a,b)=>getChampSortKey(a).localeCompare(getChampSortKey(b)));
}

function getCurrentCompetitiveChampIndex(){
  let idx = -1;
  allChamps.forEach((ch,i)=>{ if(!isAnnualSummaryChamp(ch)) idx=i; });
  return idx>=0 ? idx : Math.max(0, allChamps.length-1);
}

async function loadChamp(){
  const {data, error} = await sb.from('championship').select('*').order('created_at',{ascending:true});
  if(error||!data||!data.length){
    champData = JSON.parse(JSON.stringify(CHAMP_SEED));
    allChamps = rebuildChampViews([champData]);
  } else {
    const competitiveRows = data.map(row=>{
      const d = typeof row.data==='string'?JSON.parse(row.data):row.data;
      d._db_id = row.id;
      return d;
    }).filter(ch=>!isAnnualSummaryChamp(ch));
    allChamps = rebuildChampViews(competitiveRows);
    await checkAutoCreateChamp();
    allChamps = rebuildChampViews(allChamps);
  }
  const currentIdx = getCurrentCompetitiveChampIndex();
  champData = allChamps[currentIdx] || allChamps[allChamps.length-1];
  viewingChampIdx = currentIdx;
}

async function checkAutoCreateChamp(){
  // Check if today is past the end of the most recent competitive champ and we need a new one
  const last = allChamps.filter(ch=>!isAnnualSummaryChamp(ch)).slice(-1)[0];
  if(!last) return;
  const today = new Date();
  const endDate = new Date(last.end+'T23:59:59');
  if(today <= endDate) return; // still in current champ

  // Determine next cycle
  const lastEnd = new Date(last.end+'T12:00:00');
  const lastMonth = lastEnd.getMonth()+1; // 1-12
  let nextYear = lastEnd.getFullYear();
  let nextCycleIdx = CYCLES.findIndex(c=>c.months.includes(lastMonth));
  nextCycleIdx = (nextCycleIdx+1) % CYCLES.length;
  if(nextCycleIdx===0) nextYear++;

  const basePlayers = allChamps.filter(ch=>!isAnnualSummaryChamp(ch))[0]?.players || [];
  const newChamp = buildNewChamp(nextYear, nextCycleIdx, basePlayers);
  const {data} = await sb.from('championship').insert({data:newChamp}).select().single();
  if(data){ newChamp._db_id=data.id; allChamps = rebuildChampViews([...getCompetitiveChamps(allChamps), newChamp]); }
}

async function saveChamp(){
  const cd = allChamps[viewingChampIdx];
  if(!cd || isAnnualSummaryChamp(cd)) return;
  if(cd.closed && !cd._db_id) return; // read-only historical
  const payload = {data: cd};
  if(cd._db_id){
    await sb.from('championship').update(payload).eq('id', cd._db_id);
  } else {
    const {data} = await sb.from('championship').insert(payload).select().single();
    if(data){ cd._db_id=data.id; }
  }
  const currentId = cd._db_id || cd.name;
  allChamps = rebuildChampViews(getCompetitiveChamps(allChamps));
  viewingChampIdx = Math.max(0, allChamps.findIndex(ch=>!isAnnualSummaryChamp(ch) && ((ch._db_id && ch._db_id===currentId) || ch.name===cd.name)));
  champData = getViewedChamp();
}

function getViewedChamp(){ const visibleChamps = getHistoryChampsForUi(); return visibleChamps[viewingChampIdx]||allChamps[viewingChampIdx]||champData; }

function getChampStandings(champ){
  if(!champ) return [];
  return champ.players.map(p => {
    if(isAnnualSummaryChamp(champ)){
      const rawPts = Number(p.summary?.sort_value ?? Object.values(p.scores||{})[0] ?? 0);
      const pts = Number.isFinite(p.summary?.pts_display) ? Number(p.summary.pts_display) : Math.floor(rawPts);
      return {name:p.name, pts, v:p.summary?.v ?? null, e:p.summary?.e ?? null, d:p.summary?.d ?? null, wo:p.summary?.wo ?? null, jogos:p.summary?.jogos ?? null, champs:p.summary?.champs ?? null, _sortPts:rawPts, annual:true};
    }
    const scores = p.scores || {};
    let pts=0, v=0, e=0, d=0, wo=0;
    Object.values(scores).forEach(s => {
      pts += s;
      if(s===3) v++;
      else if(s===2) e++;
      else if(s===1) d++;
      else if(s===0) wo++;
    });
    return {name:p.name, pts, v, e, d, wo, jogos:Object.keys(scores).length, _sortPts:pts, annual:false};
  }).sort((a,b)=>(b._sortPts??b.pts)-(a._sortPts??a.pts)||((b.v??0)-(a.v??0))||((b.e??0)-(a.e??0))||((a.d??0)-(b.d??0))||a.name.localeCompare(b.name));
}

async function saveChampResults(){
  const date = document.getElementById('champ-date')?.value;
  if(!date){ toast('Selecione uma data','err'); return; }
  const visibleChamps = getHistoryChampsForUi();
  const champ = visibleChamps[viewingChampIdx] || getViewedChamp();
  const selects = document.querySelectorAll('#champ-player-inputs select[data-player]');
  let changed=0;
  selects.forEach(sel=>{
    if(!sel.value) return;
    const p = champ.players.find(x=>x.name===sel.dataset.player);
    if(p){ if(!p.scores) p.scores={}; p.scores[date]=parseInt(sel.value,10); changed++; }
  });
  if(!changed){ toast('Nenhum resultado informado','err'); return; }

  const btn=document.querySelector('#champ-players-form .btn-primary');
  if(btn) btn.disabled=true;

  const currentGameDate = appData.game?.game_date;
  const currentResult = appData.game?.sort_result;
  if(date===currentGameDate && currentResult){
    const scoreByName = {};
    champ.players.forEach(p=>{
      const val = p.scores?.[date];
      if(Number.isInteger(val)) scoreByName[p.name]=val;
    });

    const getNamesByScore = target => champ.players
      .filter(p=>p.scores?.[date]===target)
      .map(p=>p.name);

    const norm = s => String(s||'').trim().toLowerCase();
    const nameToPlayer = name => appData.players.find(p=>norm(p.name)===norm(name));

    currentResult.teamA = getNamesByScore(3).concat(getNamesByScore(1)).map(name=>{
      const existing = (currentResult.teamA||[]).find(pl=>norm(pl.name)===norm(name)) || (currentResult.teamB||[]).find(pl=>norm(pl.name)===norm(name));
      const full = nameToPlayer(name);
      return existing || full || {name};
    });
    currentResult.teamB = [];
    currentResult.waitlist = getNamesByScore(0).map(name=>{
      const full = nameToPlayer(name);
      return full?.id;
    }).filter(Boolean);

    if(Object.values(scoreByName).some(v=>v===2)) currentResult.result='empate';
    else if((currentResult.teamA||[]).length && getNamesByScore(3).length>=getNamesByScore(1).length) currentResult.result='A';

    const {error: gameErr} = await sb.from('games').update({sort_result: currentResult}).eq('id', appData.game.id);
    if(gameErr){
      if(btn) btn.disabled=false;
      toast('Erro ao salvar jogo: '+gameErr.message,'err');
      return;
    }
    appData.game.sort_result = currentResult;
  }

  await saveChamp();
  if(btn) btn.disabled=false;
  toast('Resultados salvos! 🏆');
  renderCampeonato();
}

function getPlayerAllTimeStats(playerName){
  const stats = {v:0, e:0, d:0, wo:0, pts:0, jogos:0, champs:0, wins:0, podiums:0};
  getAllChampsSorted().forEach(ch=>{
    const p = ch.players.find(x=>x.name.trim().toLowerCase()===playerName.trim().toLowerCase());
    if(!p) return;
    stats.champs++;
    if(!isAnnualSummaryChamp(ch)){
      Object.values(p.scores||{}).forEach(s=>{
        stats.pts+=s; stats.jogos++;
        if(s===3) stats.v++;
        else if(s===2) stats.e++;
        else if(s===1) stats.d++;
        else stats.wo++;
      });
    }
    if(ch.podium&&ch.podium[0]===p.name) stats.wins++;
    if(ch.podium&&ch.podium.includes(p.name)) stats.podiums++;
  });
  return stats;
}

// ── Admin: close championship ──────────────────────────────────
async function closeChampionship(){
  const visibleChamps = getHistoryChampsForUi();
  const champ = visibleChamps[viewingChampIdx] || getViewedChamp();
  if(!champ||champ.closed){ toast('Campeonato já encerrado','err'); return; }
  if(!confirm(`Encerrar o campeonato "${champ.name}"? Esta ação calculará o pódio final e não poderá ser desfeita.`)) return;

  const standings = getChampStandingsPublic(champ);
  champ.podium = standings.slice(0,3).map(p=>p.name);
  champ.winner = standings[0]?.name||null;
  champ.closed = true;

  await saveChamp();
  toast(`🏆 Campeonato encerrado! Campeão: ${champ.winner}`);
  render();
}

// ── Waitlist visibility ────────────────────────────────────────
function getWaitlistPlayers(){
  const res = appData.game?.sort_result;
  if(!res||!res.waitlist) return [];
  return res.waitlist.map(id=>appData.players.find(p=>p.id===id)).filter(Boolean);
}

function getMyWaitlistPosition(){
  if(!currentPlayer||!appData.game?.sort_result?.waitlist) return -1;
  return appData.game.sort_result.waitlist.indexOf(currentPlayer.id);
}


// ---- DECLARE GAME RESULT & APPLY CHAMPIONSHIP POINTS ----
async function declareResult(result){
  const g = appData.game;
  if(!g?.sort_result) return;
  const res = g.sort_result;
  if(!confirm(`Confirmar resultado: ${result==='A'?'Time A venceu':result==='B'?'Time B venceu':'Empate'}?
Isso aplicará pontos no campeonato para todos os jogadores.`)) return;

  const teamA = res.teamA || [];
  const teamB = res.teamB || [];
  const waitlistIds = res.waitlist || [];
  const gameDate = g.game_date;

  if(!champData && !allChamps.length){ toast('Dados do campeonato não carregados','err'); return; }
  if(!champData) champData = allChamps[allChamps.length-1];
  if(!gameDate){ toast('Data do jogo não definida','err'); return; }

  // Points map per result
  // result='A': teamA=3, teamB=1; result='B': teamA=1, teamB=3; result='empate': both=2
  const ptsA = result==='A'?3:result==='empate'?2:1;
  const ptsB = result==='B'?3:result==='empate'?2:1;
  const ptsWait = 0; // fila de espera = ausência

  // Apply points to champData players
  let applied = 0;
  champData.players.forEach(cp => {
    // Match by name (champ uses names, not IDs)
    const inA = teamA.find(p => p.name.trim().toLowerCase() === cp.name.trim().toLowerCase());
    const inB = teamB.find(p => p.name.trim().toLowerCase() === cp.name.trim().toLowerCase());
    const inWait = waitlistIds.some(id => {
      const pl = appData.players.find(p=>p.id===id);
      return pl && pl.name.trim().toLowerCase() === cp.name.trim().toLowerCase();
    });
    if(!cp.scores) cp.scores = {};
    if(inA){ cp.scores[gameDate] = ptsA; applied++; }
    else if(inB){ cp.scores[gameDate] = ptsB; applied++; }
    else if(inWait){ cp.scores[gameDate] = ptsWait; applied++; }
    // Players not in game = no entry (truly absent, no score recorded)
  });

  // Save result on game
  res.result = result;
  const {error: gameErr} = await sb.from('games').update({sort_result: res}).eq('id', g.id);
  if(gameErr){ toast('Erro ao salvar resultado: '+gameErr.message,'err'); return; }
  appData.game.sort_result = res;

  // Save championship
  await saveChamp();
  toast(`Resultado declarado! ${applied} jogadores pontuados 🏆`);
  render();
}


// ============================================================
// PASSKEYS (WebAuthn) — Login biométrico sem digitar nada
// ============================================================

function isPasskeySupported(){
  return window.PublicKeyCredential &&
    typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function';
}

function b64url(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

function b64urlDecode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str+='=';
  return Uint8Array.from(atob(str),c=>c.charCodeAt(0)).buffer;
}

function getPasskeyStore(){
  try{ return JSON.parse(localStorage.getItem('harmonia_passkeys')||'{}'); }
  catch{ return {}; }
}
function savePasskeyStore(s){ localStorage.setItem('harmonia_passkeys', JSON.stringify(s)); }

// Register a passkey for the current player after successful password login
async function registerPasskey(phone){
  if(!isPasskeySupported()) return;
  const player = appData.players.find(p=>p.phone===phone);
  if(!player) return;

  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = new TextEncoder().encode(phone);

    const cred = await navigator.credentials.create({publicKey:{
      challenge,
      rp:{ name:'Harmonia FC', id: location.hostname },
      user:{ id:userId, name:phone, displayName:player.name },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
      timeout:60000
    }});

    // Store credential ID mapped to phone
    const store = getPasskeyStore();
    store[b64url(cred.rawId)] = phone;
    savePasskeyStore(store);
    toast('✅ Biometria ativada! Próximo login sem precisar digitar nada.');
  } catch(e){
    // User cancelled or not supported — silent
    console.log('Passkey register cancelled:', e.message);
  }
}

// Try to login with passkey (called on app open)
async function tryPasskeyLogin(){
  if(!isPasskeySupported()) return false;
  const store = getPasskeyStore();
  const credIds = Object.keys(store);
  if(!credIds.length) return false;

  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const allowCreds = credIds.map(id=>({
      type:'public-key',
      id: b64urlDecode(id),
      transports:['internal']
    }));

    const assertion = await navigator.credentials.get({publicKey:{
      challenge,
      allowCredentials: allowCreds,
      userVerification:'required',
      timeout:60000
    }});

    const credId = b64url(assertion.rawId);
    const phone = store[credId];
    if(!phone) return false;

    const player = appData.players.find(p=>p.phone===phone);
    if(!player) return false;

    finishLogin(player);
    return true;
  } catch(e){
    console.log('Passkey login cancelled or failed:', e.message);
    return false;
  }
}

// Show passkey offer after password login
function offerPasskey(phone){
  if(!isPasskeySupported()) return;
  // Check if passkey already registered for this phone
  const store = getPasskeyStore();
  const already = Object.values(store).includes(phone);
  if(already) return;

  setTimeout(()=>{
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1a3a6e;color:#fff;padding:14px 20px;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px';
    banner.innerHTML = `
      <div>👆 Ativar login por biometria (Face ID / digital)?</div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button onclick="registerPasskey('${phone}');this.closest('div[style]').remove()" style="background:var(--gold);border:none;color:#7a4f00;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px">Ativar</button>
        <button onclick="this.closest('div[style]').remove()" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px">Agora não</button>
      </div>
    `;
    document.body.appendChild(banner);
  }, 1000);
}
